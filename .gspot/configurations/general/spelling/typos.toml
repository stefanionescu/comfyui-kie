[default]
locale = "en"
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "\\b[A-Za-z0-9+/]{40,}={0,2}\\b"]

[default.extend-words]
KIE = "KIE"
PNG = "PNG"
WAV = "WAV"
PDF = "PDF"
GPT = "GPT"
UTC = "UTC"
ISO = "ISO"

[files]
extend-exclude = [
  # Files that Git ignores
  "**/.DS_Store",
  "**/.venv/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/node_modules/**",
  "**/.mise.local.toml",
  ".claude/**",
  ".artifacts/**",
  "plans/**",
  # Files that gspot generates
  ".gspot/**",
  "eslint.config.mjs",
  "ruff.toml",
  "pyrightconfig.json",
  ".stylelintrc.json",
  ".markdownlint.jsonc",
  ".editorconfig",
  "prettier.config.mjs",
  ".prettierignore",
  # Generator outputs
  "web/extension.js",
  "web/extension.css",
  "**/*.pbxproj",
  "**/*.xcstrings",
  "**/*.svg",
  "**/*.min.js",
  "**/*.min.css",
  # Paths that configurations leave out, such as installed dependencies and local secrets
  "**/bower_components/**",
  "**/venv/**",
  "**/.env",
  "**/.env.*",
  "**/.dev.vars",
  "**/.dev.vars.*",
  # Lockfiles
  "**/*.lock",
  "**/bun.lockb",
  "**/pnpm-lock.yaml",
  "**/package-lock.json",
  "**/npm-shrinkwrap.json",
  "**/go.sum",
  "**/Package.resolved",
  # Local environment files
  "**/.env*",
]
