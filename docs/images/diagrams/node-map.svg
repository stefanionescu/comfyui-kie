<svg xmlns="http://www.w3.org/2000/svg" width="992" height="550" viewBox="0 0 992 550" role="img" aria-label="Node map: Image: Generate, Video: Generate, and Audio: Generate each run any KIE model of their kind, and Chat: Ask asks any KIE chat model. File: Add feeds a file input of any job node, and Chat: Attach Document feeds Chat: Ask. Task: Download collects tasks left running, and Model: Info shows what a model takes. A blue square marks a node that sends a paid request, and a hollow square one that bills nothing."><title>Node map: Image: Generate, Video: Generate, and Audio: Generate each run any KIE model of their kind, and Chat: Ask asks any KIE chat model. File: Add feeds a file input of any job node, and Chat: Attach Document feeds Chat: Ask. Task: Download collects tasks left running, and Model: Info shows what a model takes. A blue square marks a node that sends a paid request, and a hollow square one that bills nothing.</title><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A4F3"/><stop offset="1" stop-color="#2D6CFF"/></linearGradient></defs><rect width="992" height="550" rx="20" fill="#050507"/><rect x="0.5" y="0.5" width="991" height="549" rx="20" fill="none" stroke="#242939"/><text x="32" y="46" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="2.4" fill="#4D86FF">NODE MAP</text><text x="32" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="-0.5" fill="#F2F5FF">Eight nodes, grouped by kind</text><rect x="32" y="112" width="296" height="122" rx="14" fill="#11131A" stroke="#242939"/><text x="52" y="142" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="2.2" fill="#4D86FF">IMAGE</text><line x1="52" y1="152" x2="308" y2="152" stroke="#242939"/><rect x="53" y="172" width="10" height="10" rx="2" fill="url(#accent)"/><text x="74" y="182" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F2F5FF">Generate</text><text x="74" y="199" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8E96AA">Make, edit, upscale, cut out</text><rect x="348" y="112" width="296" height="122" rx="14" fill="#11131A" stroke="#242939"/><text x="368" y="142" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="2.2" fill="#4D86FF">VIDEO</text><line x1="368" y1="152" x2="624" y2="152" stroke="#242939"/><rect x="369" y="172" width="10" height="10" rx="2" fill="url(#accent)"/><text x="390" y="182" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F2F5FF">Generate</text><text x="390" y="199" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8E96AA">From text, a frame, or references</text><rect x="664" y="112" width="296" height="122" rx="14" fill="#11131A" stroke="#242939"/><text x="684" y="142" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="2.2" fill="#4D86FF">AUDIO</text><line x1="684" y1="152" x2="940" y2="152" stroke="#242939"/><rect x="685" y="172" width="10" height="10" rx="2" fill="url(#accent)"/><text x="706" y="182" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F2F5FF">Generate</text><text x="706" y="199" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8E96AA">Speech, music, and sound</text><rect x="32" y="254" width="612" height="122" rx="14" fill="#11131A" stroke="#242939"/><text x="52" y="284" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="2.2" fill="#4D86FF">CHAT</text><line x1="52" y1="294" x2="624" y2="294" stroke="#242939"/><rect x="53" y="314" width="10" height="10" rx="2" fill="url(#accent)"/><text x="74" y="324" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F2F5FF">Ask</text><text x="74" y="341" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8E96AA">Any chat model, with images</text><rect x="353.75" y="314.75" width="8.5" height="8.5" rx="2" fill="#11131A" stroke="#4D86FF"/><text x="374" y="324" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F2F5FF">Attach Document</text><text x="374" y="341" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8E96AA">A PDF or text file</text><rect x="32" y="396" width="928" height="122" rx="14" fill="#11131A" stroke="#242939"/><text x="52" y="426" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="2.2" fill="#4D86FF">SHARED</text><line x1="52" y1="436" x2="940" y2="436" stroke="#242939"/><rect x="53.75" y="456.75" width="8.5" height="8.5" rx="2" fill="#11131A" stroke="#4D86FF"/><text x="74" y="466" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F2F5FF">File: Add</text><text x="74" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8E96AA">A file for one model input</text><rect x="353.75" y="456.75" width="8.5" height="8.5" rx="2" fill="#11131A" stroke="#4D86FF"/><text x="374" y="466" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F2F5FF">Task: Download</text><text x="374" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8E96AA">Collects a task left running</text><rect x="653.75" y="456.75" width="8.5" height="8.5" rx="2" fill="#11131A" stroke="#4D86FF"/><text x="674" y="466" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F2F5FF">Model: Info</text><text x="674" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8E96AA">Every input a model takes</text><rect x="664" y="254" width="296" height="122" rx="14" fill="none" stroke="#242939"/><text x="684" y="284" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="2.2" fill="#8E96AA">LEGEND</text><rect x="685" y="314" width="10" height="10" rx="2" fill="url(#accent)"/><text x="706" y="324" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#F2F5FF">Sends a paid request</text><rect x="685.75" y="344.75" width="8.5" height="8.5" rx="2" fill="#050507" stroke="#4D86FF"/><text x="706" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#F2F5FF">Bills nothing</text></svg>
